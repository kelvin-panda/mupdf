plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// 版本唯一来源：JitPack 通过 git tag 注入 VERSION 环境变量；本地构建使用兜底值（与最近一次发布保持一致）
def jitpackVersion = project.providers.environmentVariable("VERSION")
        .orElse("6.0.42")

android {
    namespace = "com.xlk.mupdf.library"
    compileSdk = 32

    defaultConfig {
        minSdk = 21

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles("consumer-rules.pro")
        // 运行时可读的库版本号（启动日志/问题排查用），与发布版本同一来源，避免各处硬编码
        resValue "string", "mupdf_library_version", jitpackVersion.get()
//        ndk {
//            // 设置支持的SO库
//            abiFilters 'armeabi-v7a','arm64-v8a'
//        }
    }

//    sourceSets {
//        main {
//            // mac 电脑上：nativeLibs  windows电脑上：jniLibs
//            jniLibs.srcDirs = ['src/main/jniLibs']     //设置目标的so存放路径
//            jni.srcDirs = [] //禁用自动调用ndk-build
//        }
//    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    //发布时提供jar包源码
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {

    api 'androidx.appcompat:appcompat:1.4.1'
    api 'com.google.android.material:material:1.5.0'
    api 'org.greenrobot:eventbus:3.3.1'
    api 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'
}

def jitpackGroup = project.providers.environmentVariable("GROUP")
        .orElse("com.github.kelvin-panda")

def jitpackArtifact = project.providers.environmentVariable("ARTIFACT")
        .orElse("mupdf")

//https://github.com/jitpack/android-example
publishing {
    publications {
        release(MavenPublication) {
            groupId = jitpackGroup.get()
            artifactId = jitpackArtifact.get()
            version = jitpackVersion.get()

            afterEvaluate {
                from components.release
            }

            pom {
                name = 'mupdf'
                description = 'Android PDF viewer library based on MuPDF'
                url = 'https://github.com/kelvin-panda/mupdf'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}
